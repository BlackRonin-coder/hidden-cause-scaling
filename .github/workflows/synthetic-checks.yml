name: Public Synthetic Example Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public-only repository
        uses: actions/checkout@v4
      - name: Run synthetic regression checks
        run: python3 -m unittest discover -s tests -v
      - name: Run public demonstration
        run: python3 examples/synthetic_residual.py
